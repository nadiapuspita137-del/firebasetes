name: Mobile sidebar fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        env:
          CSS_B64: 
        run: |
          python -c "from pathlib import Path; import base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); css=base64.b64decode(__import__('os').environ['CSS_B64']).decode(); marker='    /* Mobile sidebar compositor fix */'; p.write_text(s if marker in s else s.replace('</style>', css+'  </style>', 1), encoding='utf-8')"

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-sidebar-fix.yml
          git commit -m "Fix mobile sidebar rendering"
          git push
