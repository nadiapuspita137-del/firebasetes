name: Fix native select styling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'fix: dark native select')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch select options and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.account-tools input,.account-tools select{height:40px;'
          rule = 'select option{background:#120b2d!important;color:#fffaff!important} select optgroup{background:#120b2d!important;color:#89efff!important} '
          if rule not in s:
              s = s.replace('    .account-tools{display:grid;', '    '+rule+'.account-tools{display:grid;', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/fix-native-select.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: dark native select" || exit 0
          git push
