name: Fix mobile sidebar portal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move mobile sidebar outside app stacking context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<main id="chatApp" class="app hidden">
  <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Tutup menu"></button>
  <aside id="mobileSidebar" class="sidebar" aria-label="Navigasi chat">'''
          new = '''<main id="chatApp" class="app hidden">
  <aside id="mobileSidebar" class="sidebar" aria-label="Navigasi chat">'''
          if old not in s:
              raise SystemExit('sidebar start pattern not found')
          s = s.replace(old, new, 1)
          old_end = '''  </aside>
  <section class="chat">'''
          # The first occurrence is the sidebar followed by chat. Keep it intact.
          if old_end not in s:
              raise SystemExit('sidebar end pattern not found')
          # Move the sidebar closing tag out later by replacing the exact chat-app tail.
          tail = '''    </footer>
  </section>
</main>
<div id="adminOverlay"'''
          replacement = '''    </footer>
  </section>
</main>
<button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Tutup menu"></button>
<div id="adminOverlay"'''
          if tail not in s:
              raise SystemExit('chat tail pattern not found')
          # Sidebar remains inside main for this pass, so instead use a DOM portal at runtime.
          s = s.replace(tail, replacement, 1)
          marker = '''<script>\nconst firebaseConfig='''
          portal = '''<script>\n// Mobile sidebar portal: remove it from the app stacking context before interaction.\n(()=>{\n  const sidebar=document.getElementById('mobileSidebar');\n  const backdrop=document.getElementById('sidebarBackdrop');\n  if(sidebar&&backdrop){\n    document.body.appendChild(backdrop);\n    document.body.appendChild(sidebar);\n  }\n})();\nconst firebaseConfig='''
          if marker not in s:
              raise SystemExit('script marker not found')
          s = s.replace(marker, portal, 1)
          # Ensure mobile fixed layers cannot be dimmed by any ancestor/visual compositor.\n          css_marker = '''    /* Mobile sidebar compositor fix */'''
          css = '''    /* Mobile sidebar compositor fix v2 */\n    @media(max-width:760px){\n      .sidebar-backdrop{position:fixed!important;z-index:9998!important;inset:0!important;display:block!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(3,1,13,.72)!important}\n      .sidebar{position:fixed!important;z-index:9999!important;left:0!important;top:0!important;bottom:0!important;right:auto!important;width:min(86vw,320px)!important;height:100dvh!important;transform:translate3d(-105%,0,0)!important;opacity:1!important;visibility:visible!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;contain:layout paint!important}\n      .sidebar.open{transform:translate3d(0,0,0)!important}\n      .sidebar-backdrop.open{opacity:1!important;pointer-events:auto!important}\n    }\n\n'''
          if css_marker in s:
              s = s.replace(css_marker, css_marker + '\n' + css, 1)
          else:
              raise SystemExit('css marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-sidebar-portal.yml
          git commit -m "Fix mobile sidebar rendering layer"
          git push
