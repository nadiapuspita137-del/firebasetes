name: Fix select dropdown appearance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'fix: style admin dropdown')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n    /* Dark native dropdown options */\n    select option{background:#120b2d!important;color:#fffaff!important}\n    select optgroup{background:#120b2d!important;color:#89efff!important}\n    .account-tools select,.admin-row select{-webkit-appearance:auto;appearance:auto;color-scheme:dark}\n'''
          if '/* Dark native dropdown options */' not in s:
              s=s.replace('<style>','<style>'+css,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: style admin dropdown"
          git rm .github/workflows/fix-select-v2.yml
          git commit -m "chore: remove temporary select fix workflow"
          git push
